name: 编译 AOSP Clang

on:
  workflow_dispatch:
    inputs:
      clang_revision:
        description: "AOSP Clang 版本编号，例如 r536225、r487747c、r547379"
        required: true
        default: "r536225"
        type: string
      toolchain_ref:
        description: "AOSP 工具链配置与补丁的提交 SHA 或分支（可选）；留空自动选择"
        default: ""
        type: string
      llvm_ref:
        description: "LLVM 基础源码的提交 SHA 或分支（可选）；留空使用 AOSP 指定的提交"
        default: ""
        type: string
      runner:
        description: "编译主机系统；ARM64 通常选 ubuntu-22.04-arm，兼顾 Ubuntu 24.04 兼容性"
        default: "ubuntu-22.04-arm"
        type: choice
        options:
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - ubuntu-24.04
      targets:
        description: "生成代码的目标架构，用英文分号分隔，例如 AArch64;ARM;X86;BPF"
        default: "AArch64;ARM;X86;BPF"
        type: string
      projects:
        description: "构建项目，需包含 clang;lld；需要额外工具时添加 ;clang-tools-extra"
        default: "clang;lld"
        type: string
      jobs:
        description: "编译并行数：0 按 CPU 和内存自动选择；链接固定使用 1 个任务"
        default: "0"
        type: string
      cmake_args:
        description: "额外 CMake 参数（可选），例如 -DLLVM_ENABLE_ASSERTIONS=ON"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ inputs.clang_revision }}-${{ inputs.runner }}"
  cancel-in-progress: false

jobs:
  build:
    name: 构建工具链
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CLANG_REVISION: ${{ inputs.clang_revision }}
      TOOLCHAIN_REF: ${{ inputs.toolchain_ref }}
      LLVM_REF: ${{ inputs.llvm_ref }}
      BUILD_TARGETS: ${{ inputs.targets }}
      BUILD_PROJECTS: ${{ inputs.projects }}
      BUILD_JOBS: ${{ inputs.jobs }}
      CMAKE_ARGS: ${{ inputs.cmake_args }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检出项目源码
        uses: actions/checkout@v7.0.1

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: 准备编译环境
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld git patch ninja-build binutils file xz-utils ca-certificates \
            zlib1g-dev libzstd-dev
          python -m pip install --disable-pip-version-check "cmake>=3.28,<4"
          mkdir -p .build/logs
          uname -m
          cmake --version
          df -h .
          python -m unittest discover -s tests -v

      - name: 下载源码并应用 AOSP 补丁
        run: |
          set -euo pipefail
          python scripts/build.py prepare \
            --clang-revision "$CLANG_REVISION" \
            --toolchain-ref "$TOOLCHAIN_REF" \
            --llvm-ref "$LLVM_REF" \
            2>&1 | tee .build/logs/prepare.log

      - name: 编译并安装工具链
        run: |
          set -euo pipefail
          python scripts/build.py build \
            --targets "$BUILD_TARGETS" \
            --projects "$BUILD_PROJECTS" \
            --jobs "$BUILD_JOBS" \
            --cmake-args="$CMAKE_ARGS" \
            2>&1 | tee .build/logs/build.log

      - name: 验证主机架构与交叉编译
        run: |
          set -euo pipefail
          python scripts/build.py verify 2>&1 | tee .build/logs/verify.log

      - name: 验证 Ubuntu 24.04 兼容性
        run: |
          set -euo pipefail
          python scripts/build.py compatibility 2>&1 | tee .build/logs/ubuntu-24.04.log

      - name: 打包工具链
        run: |
          set -euo pipefail
          python scripts/build.py package 2>&1 | tee .build/logs/package.log
          python - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path(".build/source-lock.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"已编译 **{info['clang_revision']} / Clang {info['clang_version']}**，"
                  f"运行主机为 **Linux {info['host_architecture']}**。\n\n"
                  f"LLVM 基础提交：{info['llvm_commit']}\n\n"
                  f"AOSP 补丁集提交：{info['toolchain_commit']}\n\n"
                  f"已应用补丁：{len(info['patches'])} 个；"
                  f"最低 glibc 版本：{info['minimum_glibc']}。\n\n"
                  "Ubuntu 24.04 运行与链接验证已通过。\n"
              )
          PY

      - name: 上传工具链压缩包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: "aosp-clang-${{ inputs.clang_revision }}-${{ runner.arch }}"
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: 上传编译日志与源码记录
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: "aosp-clang-logs-${{ github.run_id }}"
          path: |
            .build/logs/
            .build/source-lock.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
