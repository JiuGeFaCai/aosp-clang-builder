name: 整理已编译的 Clang 工具链

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "已成功编译的 Actions 运行编号（运行链接末尾的数字）"
        required: true
        type: string
      runner:
        description: "与原产物相同架构的编译主机"
        default: "ubuntu-22.04-arm"
        type: choice
        options:
          - ubuntu-22.04-arm
          - ubuntu-22.04

permissions:
  contents: read
  actions: read

jobs:
  repackage:
    name: 整理、验证并打包
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v7.0.1

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: 下载已编译的工具链
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: "aosp-clang-*-${{ runner.arch }}"
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .build-input
          merge-multiple: true

      - name: 整理标准目录并验证解压即用
        run: |
          set -euo pipefail
          mkdir -p .build/logs
          python -m unittest discover -s tests -v
          python scripts/repackage.py \
            --input-dir .build-input \
            --source-run-id "$SOURCE_RUN_ID" \
            2>&1 | tee .build/logs/repackage.log
          python - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path(".build/source-lock.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"已整理 **{info['clang_revision']} / Linux {info['host_architecture']}**。\n\n"
                  f"源构建：{info['repackaged_from']['run_id']}。\n\n"
                  "解压后直接运行 `bin/clang`，或运行 `sudo ./install.sh` 安装命令链接。\n\n"
                  "已通过移动目录、内置头文件、自动调用 lld、命令链接及 Ubuntu 24.04 检查。\n"
              )
          PY

      - name: 上传可直接使用的工具链
        uses: actions/upload-artifact@v7.0.2
        with:
          name: "aosp-clang-ready-${{ runner.arch }}"
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: 上传验证日志
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: "aosp-clang-repackage-logs-${{ github.run_id }}"
          path: |
            .build/logs/
            .build/source-lock.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
